name: stock_management
description: Application mobile Flutter de gestion de stock pour petites entreprises, concue et developpee par Hamza Elrhadiouini.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts & Dashboard
  fl_chart: ^0.66.0

  # UI & Utils
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Hive Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
